name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: cccpeducation/cccp-ci-base@sha256:03ead3787ed8f09068cc582191e4cd8f5e48e3ce696fe53836ecd826de57ea1f

    steps:
      - uses: actions/checkout@v7
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh test` builds
      # and tests the plugin, publishes it locally, then verifies the integrated chain.
      - name: Build, test and verify
        run: ci/run.sh test
